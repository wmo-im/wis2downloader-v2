x-env-file: &default-env
   .env

x-logging: &default-logging
  options:
    max-size: "10M"
    max-file: "2"

x-logging-loki: &loki-logging
  driver: loki
  options:
    loki-url: "http://localhost:3100/loki/api/v1/push"
    loki-retries: "5"
    mode: "non-blocking"
    max-buffer-size: "16m"
    keep-file: "true"
    max-size: "10m"
    max-file: "3"


services:
  loki:
    container_name: loki
    image: grafana/loki:3.6.7
    restart: always
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml
    networks:
      - redis-net
    logging: *default-logging


  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.10.0
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=10d'
      - '--log.level=warn'
    networks:
      - redis-net
    logging: *loki-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    container_name: grafana
    image: grafana/grafana:12.4.1
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_LOG_FILTERS=auth.client.session:error,tsdb.loki:warn,sqlstore.transactions:warn
    depends_on:
      - prometheus
      - loki
    networks:
      - redis-net
    logging: *loki-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Databases / message queues

  redis:
    container_name: redis
    build:
      context: ./containers/redis/
      dockerfile: Dockerfile
    restart: always
    env_file: *default-env
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:${CONTAINER_DATA_PATH}
    networks:
      - redis-net
    logging: *loki-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Task handling
  celery-workers-high-priority:
    restart: always
    build:
      context: .
      dockerfile: ./containers/celery/Dockerfile
      args:
        WIS2DOWNLOADER_UID: ${WIS2DOWNLOADER_UID:-10001}
        WIS2DOWNLOADER_GID: ${WIS2DOWNLOADER_GID:-988}
    volumes:
      - "${HOST_DATA_PATH}:${CONTAINER_DATA_PATH}"
    env_file: *default-env
    tty: true
    depends_on:
      - redis
      - subscription-manager
    networks:
      - redis-net
    logging: *loki-logging
    command: ["/bin/bash", "-c", "source .venv/bin/activate && task_manager_start worker --pool=threads --concurrency=8 --loglevel=${LOG_LEVEL:-info} -Q high_priority"]
    healthcheck:
      test: ["CMD-SHELL", ". .venv/bin/activate && CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${CELERY_BACKEND_DB} celery inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-workers-small-files:
    restart: always
    build:
      context: .
      dockerfile: ./containers/celery/Dockerfile
      args:
        WIS2DOWNLOADER_UID: ${WIS2DOWNLOADER_UID:-10001}
        WIS2DOWNLOADER_GID: ${WIS2DOWNLOADER_GID:-988}
    volumes:
      - "${HOST_DATA_PATH}:${CONTAINER_DATA_PATH}"
    env_file: *default-env
    tty: true
    depends_on:
      - redis
      - subscription-manager
    networks:
      - redis-net
    logging: *loki-logging
    command: ["/bin/bash", "-c", "source .venv/bin/activate && task_manager_start worker --pool=threads --concurrency=24 --loglevel=${LOG_LEVEL:-info} -Q small_files"]
    healthcheck:
      test: ["CMD-SHELL", ". .venv/bin/activate && CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${CELERY_BACKEND_DB} celery inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-workers-large-files:
    restart: always
    build:
      context: .
      dockerfile: ./containers/celery/Dockerfile
      args:
        WIS2DOWNLOADER_UID: ${WIS2DOWNLOADER_UID:-10001}
        WIS2DOWNLOADER_GID: ${WIS2DOWNLOADER_GID:-988}
    volumes:
      - "${HOST_DATA_PATH}:${CONTAINER_DATA_PATH}"
    env_file: *default-env
    tty: true
    depends_on:
      - redis
      - subscription-manager
    networks:
      - redis-net
    logging: *loki-logging
    command: ["/bin/bash", "-c", "source .venv/bin/activate && task_manager_start worker --pool=threads --concurrency=8 --loglevel=${LOG_LEVEL:-info} -Q large_files"]
    healthcheck:
      test: ["CMD-SHELL", ". .venv/bin/activate && CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${CELERY_BACKEND_DB} celery inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3


  celery-scheduler-workers:
    restart: always
    build:
      context: .
      dockerfile: ./containers/celery/Dockerfile
      args:
        WIS2DOWNLOADER_UID: ${WIS2DOWNLOADER_UID:-10001}
        WIS2DOWNLOADER_GID: ${WIS2DOWNLOADER_GID:-988}
    volumes:
      - "${HOST_DATA_PATH}:${CONTAINER_DATA_PATH}"
    env_file: *default-env
    tty: true
    depends_on:
      - redis
      - subscription-manager
    networks:
      - redis-net
    logging: *loki-logging
    command: [ "/bin/bash", "-c", "source .venv/bin/activate && scheduler_start worker --concurrency=4 --loglevel=${LOG_LEVEL:-info}" ]
    healthcheck:
      test: ["CMD-SHELL", ". .venv/bin/activate && CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/${SCHEDULER_BACKEND_DB} celery inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-beats:
    restart: always
    build:
      context: .
      dockerfile: ./containers/celery/Dockerfile
      args:
        WIS2DOWNLOADER_UID: ${WIS2DOWNLOADER_UID:-10001}
        WIS2DOWNLOADER_GID: ${WIS2DOWNLOADER_GID:-988}
    volumes:
      - "${HOST_DATA_PATH}:${CONTAINER_DATA_PATH}"
    env_file: *default-env
    tty: true
    depends_on:
      - redis
      - subscription-manager
    networks:
      - redis-net
    logging: *loki-logging
    command: [ "/bin/bash", "-c", "source .venv/bin/activate && scheduler_start beat --loglevel=${LOG_LEVEL:-info}" ]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "scheduler_start"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Main application
  subscription-manager:
    container_name: subscription-manager
    restart: always
    build:
      context: .
      dockerfile: ./containers/subscription_manager/Dockerfile
      args:
        WIS2DOWNLOADER_UID: ${WIS2DOWNLOADER_UID:-10001}
        WIS2DOWNLOADER_GID: ${WIS2DOWNLOADER_GID:-988}
    env_file: *default-env
    ports:
      - "5002:5001"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
    tty: true
    depends_on:
      - redis
    networks:
      - redis-net
    logging: *loki-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  wis2downloader-ui:
      build:
        context: .
        dockerfile: ./containers/ui/Dockerfile
      ports:
        - "8080:8080"
      env_file: *default-env
      environment:
        - WIS2DOWNLOADER_SUBSCRIPTION_MANAGER_URL=http://subscription-manager:5001
        - WIS2DOWNLOADER_GRAFANA_URL=${WIS2DOWNLOADER_GRAFANA_URL:-http://host.docker.internal:3000}
      depends_on:
        - subscription-manager
      networks:
      - redis-net

  subscriber-france:
    container_name: subscriber-france
    restart: always
    build:
      context: .
      dockerfile: ./containers/subscriber/Dockerfile
      args:
        WIS2DOWNLOADER_UID: ${WIS2DOWNLOADER_UID:-10001}
        WIS2DOWNLOADER_GID: ${WIS2DOWNLOADER_GID:-988}
    env_file: *default-env
    environment:
      GLOBAL_BROKER_HOST: globalbroker.meteo.fr
      GLOBAL_BROKER_PORT: 443
      GLOBAL_BROKER_USERNAME: everyone
      GLOBAL_BROKER_PASSWORD: everyone
      MQTT_PROTOCOL: websockets
    depends_on:
      - redis
    networks:
      - redis-net
    logging: *loki-logging
    healthcheck:
      test: ["CMD", "pgrep", "-f", "subscriber_start"]
      interval: 30s
      timeout: 5s
      retries: 3

  subscriber-brazil:
    container_name: subscriber-brazil
    restart: always
    build:
      context: .
      dockerfile: ./containers/subscriber/Dockerfile
      args:
        WIS2DOWNLOADER_UID: ${WIS2DOWNLOADER_UID:-10001}
        WIS2DOWNLOADER_GID: ${WIS2DOWNLOADER_GID:-988}
    env_file: *default-env
    environment:
      GLOBAL_BROKER_HOST: globalbroker.inmet.gov.br
      GLOBAL_BROKER_PORT: 443
      GLOBAL_BROKER_USERNAME: everyone
      GLOBAL_BROKER_PASSWORD: everyone
      MQTT_PROTOCOL: websockets
    depends_on:
      - redis
    networks:
      - redis-net
    logging: *loki-logging
    healthcheck:
      test: ["CMD", "pgrep", "-f", "subscriber_start"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
  redis-data:

networks:
  redis-net:
    driver: bridge
